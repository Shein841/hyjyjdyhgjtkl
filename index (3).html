<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFinder - Поиск фильмов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e50914;
            --primary-dark: #b2070f;
            --secondary: #221f1f;
            --dark: #141414;
            --light: #f5f5f1;
            --gray: #686868;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark);
            color: var(--light);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3em;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .header p {
            color: var(--gray);
        }

        /* Поиск */
        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto 30px;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: var(--secondary);
            color: var(--light);
            border: 1px solid var(--gray);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box button {
            padding: 0 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .search-box button:hover {
            background: var(--primary-dark);
        }

        /* Фильтры */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-select {
            padding: 10px;
            background: var(--secondary);
            color: var(--light);
            border: 1px solid var(--gray);
            border-radius: 5px;
            min-width: 150px;
        }

        /* Результаты */
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--secondary);
            border-radius: 5px;
        }

        .results-count {
            font-weight: bold;
            color: var(--primary);
        }

        .results-time {
            color: var(--gray);
        }

        /* Сетка фильмов */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Карточка фильма */
        .movie-card {
            background: var(--secondary);
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.3);
        }

        .movie-poster {
            position: relative;
            aspect-ratio: 2/3;
        }

        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .movie-info {
            padding: 12px;
        }

        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-year {
            color: var(--gray);
            font-size: 12px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            max-width: 900px;
            margin: 50px auto;
            background: var(--secondary);
            border-radius: 10px;
            padding: 30px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            cursor: pointer;
            color: var(--gray);
        }

        .modal-close:hover {
            color: var(--primary);
        }

        .modal-movie {
            display: flex;
            gap: 30px;
        }

        .modal-poster {
            flex: 0 0 250px;
        }

        .modal-poster img {
            width: 100%;
            border-radius: 5px;
        }

        .modal-details {
            flex: 1;
        }

        .modal-details h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .modal-details p {
            margin: 10px 0;
            line-height: 1.6;
            color: var(--gray);
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
        }

        .modal-info-item {
            display: flex;
            flex-direction: column;
        }

        .modal-info-label {
            font-size: 12px;
            color: var(--gray);
        }

        .modal-info-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        .modal-btn:hover {
            background: var(--primary-dark);
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 8px 12px;
            background: var(--secondary);
            color: white;
            border: 1px solid var(--gray);
            border-radius: 3px;
            cursor: pointer;
        }

        .page-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Загрузка */
        .loader {
            text-align: center;
            padding: 50px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--secondary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: var(--secondary);
            border-radius: 5px;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .modal-movie {
                flex-direction: column;
            }
            
            .modal-poster {
                text-align: center;
            }
            
            .modal-poster img {
                max-width: 200px;
            }
            
            .modal-info {
                grid-template-columns: 1fr;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 MovieFinder</h1>
            <p>Найди информацию о любом фильме</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введите название фильма..." value="avatar">
            <button onclick="searchMovies()">Поиск</button>
        </div>

        <div class="filters">
            <select id="yearFilter" class="filter-select">
                <option value="">Все годы</option>
            </select>
            
            <select id="typeFilter" class="filter-select">
                <option value="">Все типы</option>
                <option value="movie">Фильмы</option>
                <option value="series">Сериалы</option>
                <option value="episode">Эпизоды</option>
            </select>
        </div>

        <div id="resultsHeader" class="results-header" style="display: none;">
            <span class="results-count" id="resultsCount">Найдено: 0 фильмов</span>
            <span class="results-time" id="resultsTime"></span>
        </div>

        <div id="moviesGrid" class="movies-grid"></div>

        <div id="loader" class="loader" style="display: none;">
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal(event)">&times;</span>
            <div id="modalContent" class="modal-movie"></div>
        </div>
    </div>

    <script>
        // Используем OMDb API (бесплатный, без ключа для тестов)
        const API_URL = 'https://www.omdbapi.com/';
        const API_KEY = 'b9bd48a6'; // Публичный тестовый ключ
        
        let currentPage = 1;
        let totalResults = 0;
        let currentQuery = 'avatar';
        let currentYear = '';
        let currentType = '';

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initYearFilter();
            searchMovies();
        });

        // Инициализация фильтра годов
        function initYearFilter() {
            const yearSelect = document.getElementById('yearFilter');
            const currentYear = new Date().getFullYear();
            
            for (let year = currentYear; year >= 1900; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelect.appendChild(option);
            }
        }

        // Поиск фильмов
        async function searchMovies(page = 1) {
            const query = document.getElementById('searchInput').value.trim();
            const year = document.getElementById('yearFilter').value;
            const type = document.getElementById('typeFilter').value;
            
            if (!query) {
                alert('Введите название фильма');
                return;
            }
            
            currentPage = page;
            currentQuery = query;
            currentYear = year;
            currentType = type;
            
            showLoading(true);
            
            const startTime = Date.now();
            
            try {
                let url = `${API_URL}?apikey=${API_KEY}&s=${encodeURIComponent(query)}&page=${page}`;
                if (year) url += `&y=${year}`;
                if (type) url += `&type=${type}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const endTime = Date.now();
                const responseTime = ((endTime - startTime) / 1000).toFixed(2);
                
                if (data.Response === 'True') {
                    totalResults = parseInt(data.totalResults);
                    displayResults(data.Search, totalResults, responseTime);
                } else {
                    showError(data.Error || 'Фильмы не найдены');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Ошибка при загрузке данных');
            } finally {
                showLoading(false);
            }
        }

        // Отображение результатов
        function displayResults(movies, total, responseTime) {
            const grid = document.getElementById('moviesGrid');
            const header = document.getElementById('resultsHeader');
            const countDisplay = document.getElementById('resultsCount');
            const timeDisplay = document.getElementById('resultsTime');
            
            header.style.display = 'flex';
            countDisplay.textContent = `Найдено: ${total} фильмов`;
            timeDisplay.textContent = `⏱️ ${responseTime} сек`;
            
            let html = '';
            
            movies.forEach(movie => {
                const poster = movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/300x450/221f1f/e50914?text=No+Poster';
                const year = movie.Year || 'N/A';
                const type = movie.Type === 'movie' ? '🎬' : movie.Type === 'series' ? '📺' : '📼';
                
                html += `
                    <div class="movie-card" onclick="getMovieDetails('${movie.imdbID}')">
                        <div class="movie-poster">
                            <span class="movie-rating">${type}</span>
                            <img src="${poster}" alt="${movie.Title}">
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${escapeHTML(movie.Title)}</div>
                            <div class="movie-year">${year}</div>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
            updatePagination(total);
        }

        // Получение деталей фильма
        async function getMovieDetails(imdbID) {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_URL}?apikey=${API_KEY}&i=${imdbID}&plot=full`);
                const movie = await response.json();
                
                if (movie.Response === 'True') {
                    showMovieModal(movie);
                } else {
                    alert('Ошибка загрузки деталей');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при загрузке');
            } finally {
                showLoading(false);
            }
        }

        // Показать модальное окно с деталями
        function showMovieModal(movie) {
            const poster = movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/300x450/221f1f/e50914?text=No+Poster';
            
            // Формируем рейтинги
            let ratings = '';
            if (movie.Ratings && movie.Ratings.length > 0) {
                ratings = movie.Ratings.map(r => `
                    <div class="modal-info-item">
                        <span class="modal-info-label">${r.Source}</span>
                        <span class="modal-info-value">${r.Value}</span>
                    </div>
                `).join('');
            }
            
            // Ссылки
            const imdbUrl = `https://www.imdb.com/title/${movie.imdbID}`;
            const kinopoiskUrl = `https://www.kinopoisk.ru/index.php?kp_query=${encodeURIComponent(movie.Title)}`;
            
            document.getElementById('modalContent').innerHTML = `
                <div class="modal-poster">
                    <img src="${poster}" alt="${movie.Title}">
                </div>
                <div class="modal-details">
                    <h2>${escapeHTML(movie.Title)}</h2>
                    <p><strong>${movie.Year} • ${movie.Runtime} • ${movie.Genre}</strong></p>
                    
                    <div class="modal-info">
                        <div class="modal-info-item">
                            <span class="modal-info-label">Режиссер</span>
                            <span class="modal-info-value">${escapeHTML(movie.Director || 'N/A')}</span>
                        </div>
                        <div class="modal-info-item">
                            <span class="modal-info-label">Актеры</span>
                            <span class="modal-info-value">${escapeHTML(movie.Actors || 'N/A')}</span>
                        </div>
                        <div class="modal-info-item">
                            <span class="modal-info-label">Страна</span>
                            <span class="modal-info-value">${escapeHTML(movie.Country || 'N/A')}</span>
                        </div>
                        <div class="modal-info-item">
                            <span class="modal-info-label">Язык</span>
                            <span class="modal-info-value">${escapeHTML(movie.Language || 'N/A')}</span>
                        </div>
                        ${movie.imdbRating !== 'N/A' ? `
                        <div class="modal-info-item">
                            <span class="modal-info-label">IMDb Рейтинг</span>
                            <span class="modal-info-value">⭐ ${movie.imdbRating}</span>
                        </div>
                        ` : ''}
                        ${movie.imdbVotes !== 'N/A' ? `
                        <div class="modal-info-item">
                            <span class="modal-info-label">Голосов</span>
                            <span class="modal-info-value">${movie.imdbVotes}</span>
                        </div>
                        ` : ''}
                        ${ratings}
                    </div>
                    
                    <p><strong>Сюжет:</strong><br>${escapeHTML(movie.Plot || 'Описание отсутствует')}</p>
                    
                    <div class="modal-buttons">
                        <a href="${imdbUrl}" target="_blank" class="modal-btn">IMDb</a>
                        <a href="${kinopoiskUrl}" target="_blank" class="modal-btn">Кинопоиск</a>
                    </div>
                </div>
            `;
            
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // Закрыть модальное окно
        function closeModal(event) {
            if (event.target === document.getElementById('modal') || event.target.classList.contains('modal-close')) {
                document.getElementById('modal').style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        // Обновление пагинации
        function updatePagination(total) {
            const totalPages = Math.ceil(total / 10);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let html = '';
            
            html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="searchMovies(1)">⏮️</button>`;
            html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="searchMovies(${currentPage - 1})">◀</button>`;
            
            for (let i = 1; i <= Math.min(5, totalPages); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="searchMovies(${i})">${i}</button>`;
            }
            
            if (totalPages > 5) html += `<span>...</span>`;
            
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="searchMovies(${currentPage + 1})">▶</button>`;
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="searchMovies(${totalPages})">⏭️</button>`;
            
            pagination.innerHTML = html;
        }

        // Показать/скрыть загрузку
        function showLoading(show) {
            document.getElementById('loader').style.display = show ? 'block' : 'none';
            if (show) {
                document.getElementById('moviesGrid').style.opacity = '0.3';
            } else {
                document.getElementById('moviesGrid').style.opacity = '1';
            }
        }

        // Показать ошибку
        function showError(message) {
            document.getElementById('resultsHeader').style.display = 'none';
            document.getElementById('moviesGrid').innerHTML = `
                <div class="empty-state">
                    <h3>😢 ${escapeHTML(message)}</h3>
                    <p>Попробуйте изменить запрос</p>
                </div>
            `;
            document.getElementById('pagination').innerHTML = '';
        }

        // Защита от XSS
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Обработчик Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchMovies();
        });

        // Закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal(e);
        });
    </script>
</body>
</html>
